<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8">
    <title>旅行青蛙·中国之旅 (offline)</title>
    <!-- offline shell: ships the game to a self-contained local build -->
    <script src="__offline-engine.js"></script>
    <script src="__probe.js"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <!-- The package ships no favicon, so the browser's automatic request 404s and
         lands in the console as an error in every probe run. An empty data URI
         satisfies the request without adding a file. -->
    <link rel="icon" href="data:,">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="full-screen" content="true" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="360-fullscreen" content="true" />
    <style>
        html,
        body {
            -ms-touch-action: none;
            background: #ffffff;
            padding: 0;
            border: 0;
            margin: 0;
            height: 100%;
        }

        /* ---- 权利归属与告知声明 / rights notice ----------------------------
           Shown on every launch, BEFORE the game interface is reachable. It is
           plain markup in index.html (not built by the game) so it paints
           immediately, before the engine bundle is even parsed, and it covers the
           stage, which is what actually blocks input: a real pointer never reaches
           the canvas underneath. z-index is the maximum so no game dialog can
           cover it. Black background, white text, as requested. */
        #__notice {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2147483647;
            background: #000;
            color: #fff;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            /* Allow vertical panning explicitly: the game's own stylesheet sets
               -ms-touch-action: none on html/body, and a real finger must still be
               able to scroll this notice on a short phone screen. */
            touch-action: pan-y;
            font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
            line-height: 1.75;
            box-sizing: border-box;
            padding: 28px 22px 34px;
        }

        #__notice .__nwrap {
            max-width: 620px;
            margin: 0 auto;
        }

        #__notice h1 {
            font-size: 21px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            margin: 4px 0 22px;
        }

        #__notice h2 {
            font-size: 16px;
            font-weight: 700;
            margin: 22px 0 6px;
        }

        #__notice p {
            font-size: 15px;
            margin: 0 0 10px;
            text-align: justify;
            word-break: break-word;
        }

        #__notice .__lead {
            font-size: 15px;
            margin-bottom: 4px;
        }

        #__notice .__sign {
            margin-top: 26px;
            text-align: right;
            font-size: 15px;
        }

        #__notice button {
            display: block;
            margin: 30px auto 6px;
            padding: 12px 34px;
            font-size: 16px;
            font-family: inherit;
            color: #fff;
            background: #000;
            border: 1px solid #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        #__notice button:active {
            background: #fff;
            color: #000;
        }
    </style>
</head>

<body>
    <div id="__notice" role="dialog" aria-modal="true" aria-labelledby="__notice_title">
        <div class="__nwrap">
            <h1 id="__notice_title">权利归属与告知声明</h1>

            <p class="__lead">本程序为个人发起的非商业性游戏保存与研究项目，基于《旅行青蛙》（原著作权人：Hit-Point Co., Ltd.）制作。</p>

            <p>本程序所包含的游戏代码、美术素材、音乐音效、文本内容及其衍生部分，著作权均归原著作权人及相关权利人所有。</p>

            <h2>二、性质与限制</h2>
            <p>本程序不用于任何商业用途，不出售、不出租、不接受捐赠、不附带广告或任何形式的变相收费。</p>

            <p class="__sign">声明人：Balticx</p>

            <button id="__notice_ok" type="button">我已阅读，进入游戏</button>
        </div>
    </div>

    <!-- data-scale-mode="fixedHeight" made the stage WIDTH follow the screen aspect:
             stageWidth = 1136 * (windowW / windowH)
         which is >= the 640 design width only on screens at least as wide as 16:9. On
         a tall phone (20:9 -> 0.45) that yields ~511, so a layout designed for 640 lost
         ~64 px off BOTH sides -- the "left and right edges are cut off" report. But
         switching to fixedWidth unconditionally would crop the BOTTOM on a screen wider
         than 16:9 (a tablet at 4:3 gets a stage 853 tall for a 1136-tall design, and the
         menu sits at y~1064).
         So the mode is chosen from the window's aspect ratio by the script below: keep
         fixedHeight when the screen is at least as wide as the design, use fixedWidth
         when it is taller. Nothing is cropped in either direction. -->
    <div style="margin: auto;width: 100%;height: 100%;" class="egret-player" data-entry-class="Main" data-orientation="auto"
        data-scale-mode="fixedHeight" data-frame-rate="60" data-content-width="640" data-content-height="1136" data-show-paint-rect="false"
        data-multi-fingered="1" data-show-fps="false" data-show-log="false" data-show-fps-style="x:0,y:0,size:12,textColor:0xffffff,bgAlpha:0.9">
    </div>

    <script>
        /* ---- screen adaptation (chooses the stage scale mode) ----------------
           The game's design resolution is 640x1136 (16:9). Under `fixedHeight` the
           stage WIDTH is whatever the aspect gives (stageWidth = 1136 * W/H), so a
           screen taller than 16:9 -- e.g. a 20:9 phone at 0.45 -- ends up about 511
           wide and the 640-wide layout loses ~64 px off BOTH sides. Under
           `fixedWidth` the reverse happens on a wider screen: a 4:3 tablet would get
           an 853-tall stage for a 1136-tall design and lose the bottom menu.
           So: keep fixedHeight when the screen is at least as wide as the design,
           switch to fixedWidth only when it is taller. This runs BEFORE the Egret
           player is created (the runtime scripts are appended at the end of the
           document), so the difference in page geometry that switches Egret between
           "fit height" and "fit width" is decided by the actual display. */
        (function () {
            var el = document.querySelector('.egret-player');
            if (!el) return;
            var aspect = window.innerWidth / Math.max(1, window.innerHeight);
            var design = 640 / 1136;
            if (aspect < design - 0.002) el.setAttribute('data-scale-mode', 'fixedWidth');
        })();

        window.gameLanguage="China";
        window.cdn = '';
        // OFFLINE BUILD: remote CDN references neutralised; all assets served locally.
        window.cdnLaunch = '';
        window.ossLaunch = '';
        window.__OFFLINE__ = true;

        /* The notice is dismissed by an explicit tap. Until then `__probe.js`
           suppresses game audio (Music.play) and the overlay itself swallows all
           real pointer input, so nothing of the game is reachable behind it.
           The game still loads in the background, so entering is immediate. */
        window.__noticeDismissed = false;
        (function () {
            var ok = document.getElementById('__notice_ok');
            if (!ok) return;
            ok.addEventListener('click', function () {
                var n = document.getElementById('__notice');
                if (n && n.parentNode) n.parentNode.removeChild(n);
                window.__noticeDismissed = true;
            }, false);
            /* Enter/Space also dismisses, for a keyboard or a TV remote. */
            document.addEventListener('keydown', function (e) {
                if (window.__noticeDismissed) return;
                if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) {
                    if (ok) ok.click();
                }
            }, false);
        })();

        var loadSingleScript = function (src, callback) {
            var s = document.createElement('script');
            s.async = false;
            s.src = src;
            s.addEventListener('load', function () {
                s.parentNode.removeChild(s);
                s.removeEventListener('load', arguments.callee, false);
            }, false);
            s.addEventListener('error', function () {
                console.log("loaderror")
                var label=document.createElement("label")
                label.style="color: red; position: absolute; top: 50%; left:50%;height: 100px; margin-top: -50px; margin-left: -150px;"
                label.innerText="网络加载失败,请检查网络设置重试."
                document.body.appendChild(label)
            }, false);
            document.body.appendChild(s);
        };
        // was: loadSingleScript("https://ali-lxqw-hotfix.ejoy.com/c1_client/release/lingxi/android/launcherv2.js"+"?="+Math.random());
        loadSingleScript("launcher.js?=" + Math.random());
    </script>
</body>

</html>
