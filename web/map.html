<!DOCTYPE HTML>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>蛙蛙的旅行地图</title>
    <meta name="viewport" content="width=device-width,initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #efe7d3;
            color: #4a4433;
            font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
        }
        #wrap { max-width: 720px; margin: 0 auto; padding: 14px 12px 30px; }
        .head {
            display: flex; align-items: baseline; justify-content: space-between;
            border-bottom: 2px solid #b9ad8d; padding-bottom: 8px; margin-bottom: 10px;
        }
        .head h1 { font-size: 19px; margin: 0; }
        .head .count { font-size: 13px; color: #7c745c; }
        .legend { font-size: 12px; color: #7c745c; margin-bottom: 10px; line-height: 1.6; }
        .legend b { color: #5b7f43; }
        #grid {
            display: grid; gap: 8px;
            grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        }
        .card {
            position: relative; background: #f6f2e6; border: 1px solid #c8bd9e;
            border-radius: 9px; padding: 6px 4px 7px; text-align: center;
            box-shadow: 0 1px 2px rgba(80, 70, 40, .12);
        }
        .card.here { background: linear-gradient(#fdfbf3, #eef4e2); border-color: #7ba05b; }
        .card img { width: 54px; height: 54px; object-fit: contain; display: block; margin: 0 auto; }
        .card.off img { filter: grayscale(1) opacity(.42); }
        .card .p { font-size: 13px; font-weight: 600; margin-top: 2px; }
        .card .f { font-size: 10px; color: #8a8168; min-height: 12px; }
        .card.off .p, .card.off .f { color: #a79c81; }
        .tick {
            position: absolute; top: 4px; right: 5px; font-size: 11px; color: #fff;
            background: #7ba05b; border-radius: 50%; width: 15px; height: 15px;
            line-height: 15px; display: none;
        }
        .card.here .tick { display: block; }
        .museum {
            position: absolute; top: 4px; left: 5px; font-size: 9px; color: #7a5a1e;
            background: #f2d99a; border: 1px solid #d8bc74; border-radius: 4px; padding: 0 3px;
        }
        .foot {
            margin-top: 14px; font-size: 11px; color: #8a8168; line-height: 1.7;
            border-top: 1px solid #d8cfb4; padding-top: 8px;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <div class="head">
            <h1>蛙蛙的旅行地图</h1>
            <div class="count" id="count">—</div>
        </div>
        <div class="legend">
            <b>绿色打勾</b> = 这个省区的小青蛙来过（串门拜访过、已经认识）；灰色 = 还没见过。<br>
            每个省区下面写的是它的<b>省花</b>——都是游戏画好的花，不是我们补的。
        </div>
        <div id="grid"></div>
        <div class="foot" id="foot"></div>
    </div>

    <script>
        /* 离线版自制的足迹页：只读存档里的"已认识的省区"，配游戏自带的省份插画。
           刻意**不画行政区划界线** —— 公开出版的地图必须使用标准地图并标注审图号，
           自己手绘国界既不准确也不合规；这里展示的是省区卡片，不声称是地理地图。 */
        function readSave() {
            try {
                return JSON.parse(window.localStorage.getItem('frog.offline.save') || '{}');
            } catch (e) {
                return {};
            }
        }

        function render(data) {
            const save = readSave();
            const here = {};
            (save.acquireProvinces || []).forEach(function (p) { here[p] = true; });
            const museums = data.museumProvinces || {};

            const grid = document.getElementById('grid');
            let visited = 0;
            data.provinces.forEach(function (p) {
                const on = !!here[p.province];
                if (on) visited++;
                const card = document.createElement('div');
                card.className = 'card ' + (on ? 'here' : 'off');
                if (p.flower) {
                    const img = document.createElement('img');
                    img.src = 'resource/China/images/visitor/flower/' + p.flower;
                    img.alt = p.flowerName || p.name;
                    img.onerror = function () { img.style.visibility = 'hidden'; };
                    card.appendChild(img);
                }
                if (museums[p.province]) {
                    const b = document.createElement('span');
                    b.className = 'museum';
                    b.textContent = '博物馆';
                    b.title = museums[p.province];
                    card.appendChild(b);
                }
                const t = document.createElement('span');
                t.className = 'tick';
                t.textContent = '✓';
                card.appendChild(t);

                const name = document.createElement('div');
                name.className = 'p';
                name.textContent = p.name;
                card.appendChild(name);

                const fl = document.createElement('div');
                fl.className = 'f';
                fl.textContent = p.flowerName || '';
                card.appendChild(fl);

                grid.appendChild(card);
            });

            document.getElementById('count').textContent =
                '已认识 ' + visited + ' / ' + data.provinces.length + ' 个省区';
            document.getElementById('foot').innerHTML =
                '省区与省花数据来自游戏自带的 visitors/museumData 表（' + data.provinces.length
                + ' 个省区）。本页是离线版自制的足迹页，' +
                '不使用任何行政区划界线，也不代表官方地图。<br>' +
                '存档里"认识过的省区"来自小青蛙的串门访客。';
        }

        fetch('map_data.json').then(function (r) { return r.json(); })
            .then(render)
            .catch(function (e) {
                document.getElementById('count').textContent = '地图数据读取失败';
                document.getElementById('foot').textContent = String(e);
            });
    </script>
</body>

</html>
